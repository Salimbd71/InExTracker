name: Build & Release APK / AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1 or v1.0.1). Leave empty for auto'
        required: false
        default: ''
        type: string
      run_tests:
        description: 'Test units'
        required: false
        default: true
        type: boolean
      build_apk_debug:
        description: 'Apk debug'
        required: false
        default: false
        type: boolean
      build_apk_release:
        description: 'Apk release'
        required: false
        default: true
        type: boolean
      build_aab_release:
        description: 'aab release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_DIR" ]]; then
            SDK_DIR="$HOME/Android/Sdk"
            mkdir -p "$SDK_DIR"
          fi
          if [[ ! -w "$SDK_DIR" ]] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          fi

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android cmdline-tools not found; downloading..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          # Accept SDK licenses (both standard files and via sdkmanager)
          mkdir -p "$SDK_DIR/licenses"
          for hash in "24333f8a63b6825ea9c5514f83c2829b004d1fee" "d56f5187479451eabf01fb78af6dfcb131a6481e"; do
            grep -qxF "$hash" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || echo "$hash" >> "$SDK_DIR/licenses/android-sdk-license"
          done
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VER="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW_VER="$(echo "${{ inputs.version }}" | xargs)"
          else
            RAW_VER="v1.0.${{ github.run_number }}"
          fi

          if [[ "$RAW_VER" == v* ]]; then
            TAG_NAME="$RAW_VER"
            VERSION_NAME="${RAW_VER#v}"
          else
            TAG_NAME="v${RAW_VER}"
            VERSION_NAME="$RAW_VER"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Configure google-services.json (from Secrets if missing)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" && ! -f "app/google-services.json" ]]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r' | sed 's/^[[:space:]]*//')"
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              if ! printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 --decode > app/google-services.json; then
                echo "::error::GOOGLE_SERVICES_JSON is neither valid JSON starting with '{' nor valid Base64."
                exit 1
              fi
            fi
            if ! python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
              echo "::error::Decoded app/google-services.json is not valid JSON. Please re-copy the full google-services.json file into the GOOGLE_SERVICES_JSON secret."
              exit 1
            fi
            echo "created_google_services=true" >> "$GITHUB_ENV"
            echo "Configured and validated app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [[ ! -f "app/google-services.json" ]]; then
            echo "::warning::app/google-services.json is missing and GOOGLE_SERVICES_JSON secret is empty."
          fi

      - name: Configure debug keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk_debug }}
        shell: bash
        run: |
          if [[ ! -f "debug.keystore" ]]; then
            if [[ -f "debug.keystore.base64" ]]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "created_debug_keystore=true" >> "$GITHUB_ENV"
          fi

      - name: Configure release signing keystore
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk_release || inputs.build_aab_release }}
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"; then
              echo "::error::Failed to decode KEYSTORE_BASE64 secret. Ensure it is valid Base64."
              exit 1
            fi
            EFFECTIVE_KEY_PASS="${KEY_PASSWORD:-$STORE_PASSWORD}"
            if [[ -z "$STORE_PASSWORD" ]]; then
              echo "::error::KEYSTORE_BASE64 is set, but STORE_PASSWORD secret is missing or empty."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Cannot open keystore from KEYSTORE_BASE64 with STORE_PASSWORD. Verify both secrets match."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              ACTUAL_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
              if [[ -n "$ACTUAL_ALIAS" ]]; then
                echo "::warning::Keystore alias was '$ACTUAL_ALIAS' instead of 'upload'. Normalizing temporary CI keystore alias to 'upload'."
                keytool -changealias \
                  -keystore "$KEYSTORE_FILE" \
                  -storepass "$STORE_PASSWORD" \
                  -keypass "$EFFECTIVE_KEY_PASS" \
                  -alias "$ACTUAL_ALIAS" \
                  -destalias upload
              else
                echo "::error::No key alias found in keystore."
                exit 1
              fi
            fi
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EFFECTIVE_KEY_PASS" >> "$GITHUB_ENV"
            echo "used_temp_keystore=false" >> "$GITHUB_OUTPUT"
            echo "=== Release Keystore Fingerprints (add to Firebase Console) ==="
            keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias upload | grep -E "Alias name:|SHA1:|SHA256:" || true
          else
            echo "::warning::KEYSTORE_BASE64 secret not found. Generating a temporary signing keystore for this build. Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets for production releases."
            TEMP_PASS="inextracker-ci-temp"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -dname "CN=InEx Tracker, OU=Mobile, O=SLM, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "used_temp_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: >
          gradle :app:testDebugUnitTest
          --no-daemon
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk_debug }}
        run: >
          gradle :app:assembleDebug
          --no-daemon
          --stacktrace
          -PversionCode="${{ steps.meta.outputs.version_code }}"
          -PversionName="${{ steps.meta.outputs.version_name }}"
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk_release }}
        run: >
          gradle :app:assembleRelease
          --no-daemon
          --stacktrace
          -PversionCode="${{ steps.meta.outputs.version_code }}"
          -PversionName="${{ steps.meta.outputs.version_name }}"
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Build Release AAB
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_aab_release) || github.event_name != 'workflow_dispatch' }}
        run: >
          gradle :app:bundleRelease
          --no-daemon
          --stacktrace
          -PversionCode="${{ steps.meta.outputs.version_code }}"
          -PversionName="${{ steps.meta.outputs.version_name }}"
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Collect release outputs
        id: outputs
        shell: bash
        run: |
          mkdir -p release-outputs
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          COUNT=0

          if [[ -f "app/build/outputs/apk/debug/app-debug.apk" ]]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-outputs/InExTracker-debug.apk"
            COUNT=$((COUNT + 1))
          fi

          if [[ -f "app/build/outputs/apk/release/app-release.apk" ]]; then
            cp "app/build/outputs/apk/release/app-release.apk" "release-outputs/InExTracker-release.apk"
            COUNT=$((COUNT + 1))
          fi

          if [[ -f "app/build/outputs/bundle/release/app-release.aab" ]]; then
            cp "app/build/outputs/bundle/release/app-release.aab" "release-outputs/InExTracker-release.aab"
            COUNT=$((COUNT + 1))
          fi

          if [[ "$COUNT" -gt 0 ]]; then
            echo "has_outputs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_outputs=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh release-outputs/ || true

      - name: Upload build artifacts
        if: ${{ steps.outputs.outputs.has_outputs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: InExTracker-${{ steps.meta.outputs.tag_name }}
          path: release-outputs/*
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ steps.outputs.outputs.has_outputs == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: InEx Tracker ${{ steps.meta.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### InEx Tracker (${{ steps.meta.outputs.tag_name }})
            Download the built APK / AAB files from the Assets section below.
            ${{ steps.keystore.outputs.used_temp_keystore == 'true' && '> **Note:** Release artifacts were signed with a temporary CI keystore. Add `KEYSTORE_BASE64`, `STORE_PASSWORD`, and `KEY_PASSWORD` in repository secrets for consistent release signing.' || '' }}
          files: |
            release-outputs/*

      - name: Clean up temporary secrets
        if: always()
        shell: bash
        run: |
          rm -f "${{ github.workspace }}/my-upload-key.jks"
          if [[ "${{ env.created_google_services }}" == "true" ]]; then
            rm -f app/google-services.json
          fi
          if [[ "${{ env.created_debug_keystore }}" == "true" ]]; then
            rm -f debug.keystore
          fi
